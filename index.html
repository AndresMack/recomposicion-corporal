return`<h1>Comida</h1><div class="mu" style="margin:-8px 4px 12px">Pesa en gramos. Arroz, pasta y papa cocidos; carnes y verduras en crudo. Verde = dentro de ±5 % de tu guía. Toca "Guardar registro" en cada comida para sumarla al día.</div><div class="g" id="sum"></div>`+M.map(([n,ms],mi)=>{const e=F[mi]||{},m=e.m||0,v=(e.v||{})[m]||[],h=H[mi];return`<div class="g"><div class="row"><b style="font-size:18px">${n}</b>${h?`<span class="bd ok">✓ Guardado ${h.t}</span>`:''}</div>`+(ms.length>1?`<div class="chips" style="margin-top:8px">${ms.map((_,j)=>`<button class="c${j==m?' on':''}" onclick="sm(${mi},${j})">Menú ${j+1}</button>`).join('')}</div>`:'')+(PH[mi+'_'+m]||DEF[mi+'_'+m]?`<img class="ei" style="width:auto;max-width:100%;max-height:340px;margin:10px auto 0" src="${PH[mi+'_'+m]||DEF[mi+'_'+m]}" alt="">`:plate(ms[m]))+`<div class="row" style="justify-content:center;margin:6px 0"><label class="b s">${PH[mi+'_'+m]||DEF[mi+'_'+m]?'Cambiar foto':'Usar mi foto'}<input type="file" accept="image/*" hidden onchange="up(${mi},${m},this.files[0])"></label>${PH[mi+'_'+m]?`<button class="b s" onclick="up(${mi},${m})">Quitar</button>`:''}</div>`+ms[m].map(([id,t],i)=>{const I=ING[id];return`<div class="ir"><div><b>${I[0]}</b><div class="mu">Guía: ${t} ${I[1]}</div></div><div class="in"><input type="number" inputmode="decimal" placeholder="${I[1]}" value="${v[i]??''}" oninput="wf(${mi},${i},this.value)"><span class="pl" id="s${mi}_${i}"></span></div></div>`}).join('')+`<div class="mu" id="mm${mi}" style="margin-top:8px"></div><div class="row" style="margin-top:12px"><button class="b" style="flex:1" onclick="gs(${mi})">Guardar registro</button><button class="b s" onclick="cl(${mi})">Borrar</button></div></div>`}).join('')+`<div class="g"><b>Bebida</b><div class="mu" style="margin:4px 0">Con las comidas puedes tomar gaseosa 0 azúcar. Además, 2 litros de agua al día sin contar la del entrenamiento.</div><img class="ei" style="width:auto;max-width:55%;max-height:260px;margin:8px a function wf(mi,i,x){const D=td();S.f[D]=S.f[D]||{};const e=S.f[D][mi]=S.f[D][mi]||{m:0,v:{}},m=e.m||0;(e.v[m]=e.v[m]||[])[i]=x;sv();cf()}
function sm(mi,j){const D=td();S.f[D]=S.f[D]||{};const e=S.f[D][mi]=S.f[D][mi]||{m:0,v:{}};e.m=j;sv();R()}

function gs(mi){const D=td(),e=(S.f[D]||{})[mi]||{},c=mc(mi,e);if(!c.k)return tt('Ingresa al menos un peso');S.h=S.h||{};(S.h[D]=S.h[D]||{})[mi]={m:e.m||0,v:(e.v||{})[e.m||0]||[],a:c.a,t:new Date().toTimeString().slice(0,5)};sv();R();tt(M[mi][0]+' guardado')}
function cf(){const F=S.f[td()]||{},H=(S.h||{})[td()]||{};
M.forEach(([n,ms],mi)=>{const e=F[mi]||{},c=mc(mi,e);ms[e.m||0].forEach((_,i)=>{const el=$('#s'+mi+'_'+i),q=c.st[i];el.className='pl '+(q?q[0]:'');el.textContent=q?q[1]:''});$('#mm'+mi).textContent=c.k?`P ${r(c.a[0])} · G ${r(c.a[1])} · C ${r(c.a[2])} · ${r(c.a[0]*4+c.a[1]*9+c.a[2]*4)} kcal`+(c.all?'  ✓ Comida en medida':''):''});
let A=[0,0,0];Object.values(H).forEach(x=>A=A.map((s,q)=>s+x.a[q]));const kc=A[0]*4+A[1]*9+A[2]*4;
$('#sum').innerHTML=`<div class="mu">Total guardado hoy vs tu meta</div>`+[['Calorías',kc,2500,'kcal','#ff9500'],['Proteína',A[0],160,'g','#007aff'],['Grasas',A[1],70,'g','#ff2d55'],['Carbohidratos',A[2],307,'g','#34c759']].map(([n,v,t,u,c])=>{const d=v-t,o=Math.abs(d)<=t*.05;return`<div class="mr"><div class="row"><b>${n}</b><span class="pl ${v?o?'ok':d<0?'lo':'hi':''}">${v?r(v)+' / '+t+' '+u+' · '+(o?'✓ En medida':d<0?'faltan '+r(-d):'te pasas '+r(d)):'meta '+t+' '+u}</span></div><div class="pb"><i style="width:${Math.min(100,v/t*100)}%;background:${c}"></i></div></div>`}).join('')}
/* CUERPO */
function ch(p,g,col){p=p.slice(-30);if(!p.length)return'<p class="mu">Sin datos todavía</p>';const ys=p.map(a=>a.y).concat(g?[g]:[]);let a=Math.min(...ys),b=Math.max(...ys);if(a==b){a-=1;b+=1}const q=(b-a)*.15;a-=q;b+=q;const W=320,H=150,X=i=>p.length>1?24+i*(W-48)/(p.length-1):W/2,Y=v=>H-24-(v-a)/(b-a)*(H-48),L=i=>`<text x="${X(i)}" y="${Y(p[i].y)-10}" text-anchor="middle" font-size="11" fill="#86868b">${+p[i].y.toFixed(1)}</text>`;

function vC(){const b=S.b,l=b[b.length-1]||{},p=S.p,g=+p.g,h=+p.h,w=+l.w,s=b[0]?+b[0].w:0,df=w&&g?w-g:null,im=w&&h?w/((h/100)**2):null,pc=w&&g&&s!=g?Math.max(0,Math.min(100,(s-w)/(s-g)*100)):0;
const f=(i,lb,v)=>`<div><label>${lb}</label><input id="${i}" type="number" inputmode="decimal" value="${v||''}"></div>`;
return`<h1>Cuerpo</h1><div class="g"><div class="fg">${f('iw','Peso (kg)',l.w)}${f('ih','Altura (cm)',p.h)}${f('ic','Cintura (cm) · cinta al nivel del ombligo',l.c)}${f('ig','Meta de peso (kg)',p.g)}</div><button class="b" style="width:100%;margin-top:12px" onclick="sb()">Guardar medición de hoy</button></div>`+
(w?`<div class="st"><div class="g"><div class="mu">Peso actual</div><b>${w} kg</b></div><div class="g"><div class="mu">Meta</div><b>${g?g+' kg':'—'}</b></div><div class="g"><div class="mu">${df==null?'Diferencia':df>0?'Te faltan por bajar':df<0?'Te faltan por subir':'Meta lograda'}</div><b>${df==null?'—':Math.abs(+df.toFixed(1))+' kg'}</b></div><div class="g"><div class="mu">IMC</div><b>${im?im.toFixed(1):'—'}</b></div></div>`+(g&&b.length>1?`<div class="g"><div class="row"><b>Avance hacia tu meta</b><span class="bd">${r(pc)} %</span></div><div class="pb"><i style="width:${pc}%"></i></div></div>`:''):'')+
`<div class="g"><b>Peso (kg)</b>${ch(b.map(x=>({x:x.d,y:+x.w})),g||null,'#007aff')}</div><div class="g"><b>Cintura (cm)</b>${ch(b.filter(x=>x.c).map(x=>({x:x.d,y:+x.c})),null,'#ff9500')}</div>`+
(b.length?`<div class="g"><b>Historial</b>`+b.map((x,i)=>[x,i]).slice(-6).reverse().map(([x,i])=>`<div class="ir"><span>${x.d.slice(5)} · ${x.w} kg${x.c?' · '+x.c+' cm':''}</span><button class="b s" onclick="db(${i})">Borrar</button></div>`).join('')+`</div>`:'')}
function sb(){const w=+$('#iw').value,c=+$('#ic').value;S.p.h=$('#ih').value;S.p.g=$('#ig').value;if(w){const D=td();S.b=S.b.filter(x=>x.d!=D);S.b.push({d:D,w,c:c||''});S.b.sort((a,b)=>a.d>b.d?1:-1)}sv();R();tt(w?'Medición guardada':'Datos guardados')}

function ses(k){return Object.keys(S.w||{}).sort().map(d=>{const a=S.w[d].l[k];return a&&a.length&&{d,m:Math.max(...a.map(x=>x[0])),n:a.length,r:a.reduce((t,x)=>t+x[1],0),v:a.reduce((t,x)=>t+x[0]*x[1],0),a}}).filter(Boolean)}

const A=[];T.forEach((t,d)=>t[2].forEach((e,i)=>{const k=d+'-'+i,s=ses(k);if(s.length)A.push([k,e[0]+' · Día '+(d+1),s])}));
if(!A.find(a=>a[0]==sx))sx=A[0][0];const c=A.find(a=>a[0]==sx),s=c[2],y=s.map(x=>[x.m,x.r,x.n,x.v][pm]),z=s[s.length-1],ch0=s.length>1&&y[0]?(y[y.length-1]-y[0])/y[0]*100:null;
return`<h1>Progreso</h1>${pk()}<div class="g"><b>Entrenamientos guardados</b>`+ds.slice(-6).reverse().map(d=>{const l=Object.values(W[d].l).flat();return`<div class="ir"><span>${d.slice(5)} · ${T[W[d].d][0]}</span><span class="mu">${l.length} series · ${l.reduce((t,x)=>t+x[1],0)} reps · ${r(l.reduce((t,x)=>t+x[0]*x[1],0))} kg·rep</span></div>`}).join('')+`</div><div class="g"><b>${c[1]}</b><div class="sg">${PN.map((n,j)=>`<button class="${j==pm?'on':''}" onclick="pm=${j};R()">${n}</button>`).join('')}</div>${ch(s.map((x,i)=>({x:x.d,y:y[i]})),null,'#007aff')}<div class="mu">Última sesión: ${z.n} series · ${z.r} reps · máx. ${z.m} kg</div><div class="mu">${z.a.map(x=>x[0]+' kg × '+x[1]).join(' · ')}</div><div class="mu">${s.length} sesión${s.length>1?'es':''} · ${ch0==null?'guarda otra sesión para comparar':PN[pm].toLowerCase()+' '+(ch0>=0?'+':'')+r(ch0)+' % desde la primera'}</div></div><div class="g"><b>Tus ejercicios</b>`+A.map(a=>{const q=a[2],l=q[q.length-1];return`<div class="ir" style="cursor:pointer;${a[0]==sx?'color:var(--bl)':''}" onclick="sx='${a[0]}';R()"><span>${a[1]}</span><span class="bd">${l.n}×${r(l.r/l.n)} · ${l.m} kg</span></div>`}).join('')+`</div>`}
